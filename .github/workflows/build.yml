name: Build High Brightness Control V3.2 Final
on:
  push:
    branches: [ high-brightness-control-v2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Materialize verified V3.1 Final baseline and apply V3.2 Final patch
        shell: bash
        run: |
          echo '964f6efb63f9744d4480258b74141e1be4e4ff62ee8b55d4e741c9fcc0bfe01a  hbc-project-v2.1.tar.gz' | sha256sum -c -
          gzip -t hbc-project-v2.1.tar.gz
          mkdir -p hbc-src
          tar -xzf hbc-project-v2.1.tar.gz -C hbc-src
          python3 - <<'PY'
          from pathlib import Path

          p = Path('hbc-src/app/src/main/java/com/highbrightnesscontrol/note4/RootShell.java')
          s = p.read_text()
          old = '                input.write("rc=$?; echo " + marker + "$rc");'
          new = '                input.write("rc=$?; printf \'\\\\n" + marker + "%s\\\\n\' \\"$rc\\"");'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))

          p = Path('hbc-src/app/src/main/java/com/highbrightnesscontrol/note4/MainActivity.java')
          s = p.read_text()
          replacements = {
              'TextView five = text("2000%", 12, MUTED);': 'TextView five = text("5000%", 12, MUTED);',
              'sensitivity.setMax(2000);': 'sensitivity.setMax(5000);',
              '500% uses one-fifth the reference light level; 2000% uses one-twentieth.': '500% uses one-fifth the reference light level; 5000% uses one-fiftieth.',
              'Math.min(2000, prefs.getInt(Prefs.SENSITIVITY, 100))': 'Math.min(5000, prefs.getInt(Prefs.SENSITIVITY, 100))',
          }
          for old, new in replacements.items():
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          p.write_text(s)

          p = Path('hbc-src/app/src/main/java/com/highbrightnesscontrol/note4/HbmService.java')
          s = p.read_text()
          old = 'Math.min(2000, prefs.getInt(Prefs.SENSITIVITY, 100))'
          assert s.count(old) == 2
          p.write_text(s.replace(old, 'Math.min(5000, prefs.getInt(Prefs.SENSITIVITY, 100))'))

          p = Path('hbc-src/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          portrait = '            android:screenOrientation="portrait"\n'
          assert s.count(portrait) == 1
          p.write_text(s.replace(portrait, ''))

          p = Path('hbc-src/app/build.gradle')
          s = p.read_text()
          assert s.count('versionCode 3') == 1
          assert s.count("versionName '2.1'") == 1
          p.write_text(s.replace('versionCode 3', 'versionCode 4').replace("versionName '2.1'", "versionName '2.2'"))
          PY

          cd hbc-src
          patch -p1 --fuzz=0 < ../hbc-v3-final.patch
          cd ..

          mkdir -p v31flat
          cp hbc-src/app/src/main/java/com/highbrightnesscontrol/note4/HbmService.java v31flat/HbmService.java
          cp hbc-src/app/src/main/java/com/highbrightnesscontrol/note4/MainActivity.java v31flat/MainActivity.java
          cp hbc-src/app/src/main/java/com/highbrightnesscontrol/note4/Prefs.java v31flat/Prefs.java
          cp hbc-src/app/build.gradle v31flat/app-build.gradle
          cat hbc-v3.1-final.patch.part00 hbc-v3.1-final.patch.part01 hbc-v3.1-final.patch.part02 hbc-v3.1-final.patch.part03 > hbc-v3.1-final.patch
          echo '60b088133d74c3f88e321940dd45a470beae58a506734d0f5c2a93c586774c2e  hbc-v3.1-final.patch' | sha256sum -c -
          patch -d v31flat -p1 --fuzz=0 < hbc-v3.1-final.patch
          cp v31flat/HbmService.java hbc-src/app/src/main/java/com/highbrightnesscontrol/note4/HbmService.java
          cp v31flat/MainActivity.java hbc-src/app/src/main/java/com/highbrightnesscontrol/note4/MainActivity.java
          cp v31flat/Prefs.java hbc-src/app/src/main/java/com/highbrightnesscontrol/note4/Prefs.java
          cp v31flat/app-build.gradle hbc-src/app/build.gradle
          mkdir -p hbc-src/app/src/main/res/layout
          cp v31flat/notification_hbc.xml hbc-src/app/src/main/res/layout/notification_hbc.xml

          echo '1a7f8ded696b109b5471f3b5838ac408b07ff82029a8c47e7e33338b77925bbf  hbc-v3.2-final.patch' | sha256sum -c -
          cd hbc-src
          patch -p1 --fuzz=0 < ../hbc-v3.2-final.patch
          cd ..

          MAIN=hbc-src/app/src/main/java/com/highbrightnesscontrol/note4/MainActivity.java
          SERVICE=hbc-src/app/src/main/java/com/highbrightnesscontrol/note4/HbmService.java
          BRIDGE=hbc-src/app/src/main/java/com/highbrightnesscontrol/note4/PowerBrightnessBridge.java
          PREFS=hbc-src/app/src/main/java/com/highbrightnesscontrol/note4/Prefs.java
          ROOT=hbc-src/app/src/main/java/com/highbrightnesscontrol/note4/RootShell.java
          NOTE=hbc-src/app/src/main/res/layout/notification_hbc.xml
          BUTTON=hbc-src/app/src/main/res/drawable/notification_button.xml
          MANIFEST=hbc-src/app/src/main/AndroidManifest.xml

          grep -F 'sensitivity.setMax(200);' "$MAIN"
          grep -F '0–1,000,000%' "$MAIN"
          grep -F 'Apply multiplier to Samsung auto brightness' "$MAIN"
          grep -F 'SAVE SETTINGS & CLOSE' "$MAIN"
          grep -F 'RESTORE DEFAULTS & CLOSE' "$MAIN"
          grep -F 'APPLY_TO_AUTO_BRIGHTNESS' "$PREFS"
          grep -F 'SCREEN_BRIGHTNESS_MODE_AUTOMATIC' "$SERVICE"
          grep -F 'samsungBrightnessForLux' "$SERVICE"
          grep -F 'PowerBrightnessBridge.class.getName()' "$SERVICE"
          grep -F 'ACTION_TOGGLE_MASTER' "$SERVICE"
          grep -F 'ACTION_RESTORE_AND_STOP' "$SERVICE"
          grep -F 'OFF · STOCK SETTINGS' "$SERVICE"
          grep -F 'ENABLED · MONITORING' "$SERVICE"
          grep -F 'ACTIVE · AUTO MULTIPLIER' "$SERVICE"
          grep -F 'notification_toggle' "$SERVICE"
          grep -F 'notification_exit' "$SERVICE"
          grep -F 'setTemporaryScreenBrightnessSettingOverride' "$BRIDGE"
          grep -F 'ownerAlive(ownerPid)' "$BRIDGE"
          grep -F 'Integer.valueOf(-1)' "$BRIDGE"
          grep -F 'android:id="@+id/notification_toggle"' "$NOTE"
          grep -F 'android:id="@+id/notification_exit"' "$NOTE"
          grep -F 'android:background="#000000"' "$NOTE"
          grep -F 'android:textColor="#FFFFFFFF"' "$NOTE"
          grep -F '<solid android:color="#000000"' "$BUTTON"
          grep -F 'versionCode 8' hbc-src/app/build.gradle
          grep -F "versionName '3.2 Final'" hbc-src/app/build.gradle
          grep -F "applicationId 'com.highbrightnesscontrol.note4'" hbc-src/app/build.gradle
          grep -F 'printf' "$ROOT"
          ! grep -F 'writeNode(brightnessPath' "$SERVICE"
          ! grep -R -F 'service call power' hbc-src/app/src/main/java
          ! grep -R -F 'new String[]{"su", "-c"' hbc-src/app/src/main/java
          ! grep -R -F 'setenforce' hbc-src/app/src/main/java
          ! grep -R -F '/sys/class/sensors/light_sensor/lux' hbc-src/app/src/main/java
          ! grep -R -F '/sys/class/sensors/light_sensor/raw_data' hbc-src/app/src/main/java
          ! grep -F 'screenOrientation="portrait"' "$MANIFEST"
          test "$(grep -c '<uses-permission' "$MANIFEST")" -eq 1
          grep -F 'android.permission.RECEIVE_BOOT_COMPLETED' "$MANIFEST"
          sed -i '/android {/a\    lint { disable "ExpiredTargetSdkVersion" }' hbc-src/app/build.gradle
      - name: Build release APK
        working-directory: hbc-src
        run: gradle :app:assembleRelease --no-daemon
      - name: Prepare unsigned APK
        shell: bash
        run: |
          mkdir -p artifact
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -p -f 4 hbc-src/app/build/outputs/apk/release/app-release-unsigned.apk artifact/High_Brightness_Control_V3.2_Final_UNSIGNED_ALIGNED.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" artifact/apksigner.jar
          sha256sum artifact/High_Brightness_Control_V3.2_Final_UNSIGNED_ALIGNED.apk > artifact/unsigned.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: high-brightness-control-v3-2-final
          path: artifact/*
          if-no-files-found: error
