name: Build Note4 CA Transfer APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Materialize project
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/project.tar.gz
          tar -xzf /tmp/project.tar.gz
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Zipalign unsigned APK
        shell: bash
        run: |
          mkdir -p artifact
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk artifact/Note4_CA_Transfer_System_Installer_v1.0_UNSIGNED_ALIGNED.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" artifact/apksigner.jar
          sha256sum artifact/Note4_CA_Transfer_System_Installer_v1.0_UNSIGNED_ALIGNED.apk > artifact/unsigned.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: note4-ca-build
          path: artifact/*
          if-no-files-found: error
