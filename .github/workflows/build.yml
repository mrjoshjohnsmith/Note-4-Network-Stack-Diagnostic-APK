name: Build High Brightness Control 2.1
on:
  push:
    branches: [ high-brightness-control-v2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Materialize project
        shell: bash
        run: |
          echo 'cd940509ffe656bdda433466ec75b80b93da94efb5b45381bd4287d7a0fdf7d4  hbc-project-v2.1.tar.gz' | sha256sum -c -
          gzip -t hbc-project-v2.1.tar.gz
          mkdir -p hbc-src
          tar -xzf hbc-project-v2.1.tar.gz -C hbc-src
          sed -i '/android {/a\    lint { disable "ExpiredTargetSdkVersion" }' hbc-src/app/build.gradle
      - name: Build release APK
        working-directory: hbc-src
        run: gradle :app:assembleRelease --no-daemon
      - name: Prepare unsigned APK
        shell: bash
        run: |
          mkdir -p artifact
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -p -f 4 hbc-src/app/build/outputs/apk/release/app-release-unsigned.apk artifact/High_Brightness_Control_v2.1_UNSIGNED_ALIGNED.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" artifact/apksigner.jar
          sha256sum artifact/High_Brightness_Control_v2.1_UNSIGNED_ALIGNED.apk > artifact/unsigned.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: high-brightness-control-v2-1
          path: artifact/*
          if-no-files-found: error
